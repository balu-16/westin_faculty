<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Westin College Faculty & Admin Portal — timetable, attendance, events, study materials and daily reports in one place."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Westin College — Faculty &amp; Admin Portal</title>
    <!-- OneSignal Web Push — SDK + init (Site URL: https://westin-faculty.vercel.app). Auto-prompt disabled; -->
    <!-- permission is requested post-login via OneSignalDeferred in src/lib/onesignal.ts. -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function (OneSignal) {
        await OneSignal.init({
          appId: "88500375-185d-4ea7-b3fc-bf32b8280b3b",
          allowLocalhostAsSecureOrigin: true,
          notifyButton: { enable: false },
          // No auto-prompt categories — prompt is triggered programmatically after OTP login
          promptOptions: { slidedown: { prompts: [] } },
        });
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
