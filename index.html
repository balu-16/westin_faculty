<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Westin College Faculty & Admin Portal — timetable, attendance, events, study materials and daily reports in one place."
    />
    <meta name="theme-color" content="#3ba7f2" />
    <!-- iOS home-screen web app: required for web push on iPhone (iOS 16.4+, installed via Share → Add to Home Screen) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Westin" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Westin College — Faculty &amp; Admin Portal</title>
    <!-- OneSignal Web Push — Site URL https://westin-faculty.vercel.app (shared faculty+admin deployment) -->
    <!-- Custom Code setup: NO auto-prompt. Permission is requested AFTER login via a user gesture (Settings toggle / post-login banner), never on page load. -->
    <!-- If you see "Permission blocked" here, the dashboard is still on Typical Site auto-prompt — switch it to Custom Code and remove any dashboard prompts. -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function (OneSignal) {
        // Disable all auto prompts — we trigger push opt-in manually after login.
        await OneSignal.init({
          appId: "88500375-185d-4ea7-b3fc-bf32b8280b3b",
          allowLocalhostAsSecureOrigin: true,
          notifyButton: { enable: false },
          promptOptions: { slidedown: { prompts: [] } },
          welcomeNotification: { disable: true },
          autoResubscribe: false,
        });
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
